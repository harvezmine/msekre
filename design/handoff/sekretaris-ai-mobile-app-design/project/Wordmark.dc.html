<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex;align-items:center;gap:{{ gap }}"><img src="assets/s-mark.png" alt="" style="height:{{ markH }};width:auto;display:block"><span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:{{ fs }};line-height:1;letter-spacing:-.02em;color:{{ ink }};white-space:nowrap">Sekretaris <span style="color:{{ ai }}">AI</span></span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:80},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:22,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:12,&quot;max&quot;:64},&quot;onDark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.size ?? 22, dark = this.props.onDark ?? false;
    return { fs: s + 'px', markH: Math.round(s * 1.6) + 'px', gap: Math.round(s * 0.45) + 'px', ink: dark ? '#ECF2EA' : '#0D2B22', ai: dark ? '#81C084' : '#4DA36E' };
  }
}
</script>
</body>
</html>
