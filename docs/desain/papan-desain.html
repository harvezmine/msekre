*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E8E6E0}
body{font-family:var(--font);color:#15181B;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

/* ============ THEME TOKENS ============ */
.t-light{
  --bg:#F7F6F2;--surface:#FFFFFF;--raised:#FFFFFF;--sunken:#F0EEE8;--sunken-2:#E6E3DB;
  --text:#15181B;--muted:#64686F;--faint:#A4A7AC;--line:#E9E7E1;
  --brand:#1D7550;--on-brand:#FFFFFF;--brand-ink:#1D7550;--brand-soft:#E3F1E8;
  --blue:#3B6FE0;--blue-ink:#2F5BC4;--blue-soft:#E8EEFC;
  --orange:#F08A24;--orange-ink:#A64F08;--orange-soft:#FDEEDD;
  --violet:#7C5CE6;--violet-ink:#6343D1;--violet-soft:#EFEAFD;
  --sky:#1AA3C9;--sky-ink:#0D6F8B;--sky-soft:#E2F4FA;
  --coral:#E5484D;--coral-ink:#C8313A;--coral-soft:#FDE8E8;
  --on-accent:#15181B;--tabbar:#FFFFFF;
  --sh-1:0 1px 2px rgba(21,24,27,.04),0 4px 14px -2px rgba(21,24,27,.06);
  --sh-2:0 1px 2px rgba(21,24,27,.04),0 14px 34px -8px rgba(21,24,27,.13);
  --sh-key:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(21,24,27,.07),0 6px 16px -4px rgba(21,24,27,.13);
  --gf-a:.30;--gf-b:.42;--gf-c:.20;
}
.t-dark{
  --bg:#0E1012;--surface:#171A1E;--raised:#1F2328;--sunken:#202328;--sunken-2:#2A2E34;
  --text:#F2F3F5;--muted:#9CA1A8;--faint:#5E636A;--line:#262A30;
  --brand:#5BBF86;--on-brand:#0E1012;--brand-ink:#5BBF86;--brand-soft:#15291F;
  --blue:#6E96F5;--blue-ink:#8DADF7;--blue-soft:#18223A;
  --orange:#F5A04F;--orange-ink:#F5A04F;--orange-soft:#2C2015;
  --violet:#A58BFF;--violet-ink:#B6A0FF;--violet-soft:#231D38;
  --sky:#4CC3E3;--sky-ink:#4CC3E3;--sky-soft:#10272E;
  --coral:#F2777B;--coral-ink:#F2777B;--coral-soft:#311A1C;
  --on-accent:#0E1012;--tabbar:#131619;
  --sh-1:inset 0 1px 0 rgba(255,255,255,.035);
  --sh-2:inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px -14px rgba(0,0,0,.7);
  --sh-key:inset 0 1px 0 rgba(255,255,255,.07),0 2px 4px rgba(0,0,0,.35),0 10px 22px -8px rgba(0,0,0,.6);
  --gf-a:.22;--gf-b:.10;--gf-c:.30;
}
.t-voice{
  --bg:#07090B;--surface:rgba(242,243,245,.08);--text:#F2F3F5;--muted:#9CA1A8;--faint:#5E636A;--line:rgba(242,243,245,.1);
  --brand:#5BBF86;--orange:#F5A04F;--on-accent:#0E1012;
}

/* ============ SCREEN PRIMITIVES ============ */
.scr{position:relative;width:393px;height:873px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);isolation:isolate}
.num{font-variant-numeric:tabular-nums}
.sb{position:absolute;inset:0 0 auto 0;height:32px;padding:0 20px 0 24px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;z-index:50}
.sb-i{display:flex;gap:6px;align-items:center}
.gb{position:absolute;inset:auto 0 0 0;height:20px;z-index:60;pointer-events:none}
.gb:after{content:"";position:absolute;left:50%;bottom:7px;width:108px;height:4px;margin-left:-54px;border-radius:2px;background:var(--text);opacity:.28}
.flow{position:absolute;top:32px;left:0;right:0;z-index:2}
.gf{position:absolute;inset:0 0 auto 0;height:420px;z-index:0;pointer-events:none;
  background:
   radial-gradient(260px 240px at 6% 2%, rgba(25,179,166,var(--gf-a)), transparent 72%),
   radial-gradient(240px 200px at 52% -6%, rgba(183,224,122,var(--gf-b)), transparent 72%),
   radial-gradient(280px 260px at 104% 8%, rgba(59,111,224,var(--gf-c)), transparent 72%);}
.gf.warm{background:
   radial-gradient(300px 260px at 20% 0%, rgba(255,190,110,.40), transparent 72%),
   radial-gradient(260px 220px at 100% 4%, rgba(240,138,36,.16), transparent 72%);}
.gf.cool{background:
   radial-gradient(320px 300px at 50% 8%, rgba(26,163,201,.20), transparent 72%),
   radial-gradient(220px 200px at 0% 0%, rgba(183,224,122,.14), transparent 72%);}
.t-dark .gf.cool{background:radial-gradient(320px 300px at 50% 10%, rgba(76,195,227,.16), transparent 72%)}

.pad{padding-left:20px;padding-right:20px}
.h1{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.025em}
.title{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.025em}
.h2{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.h3{font-size:16px;line-height:22px;font-weight:600}
.body{font-size:16px;line-height:24px}
.lbl{font-size:14px;line-height:20px;font-weight:500}
.cap{font-size:13px;line-height:18px;font-weight:500;color:var(--muted)}
.mut{color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;height:28px}
.lnk{display:flex;align-items:center;gap:1px;font-size:14px;font-weight:600}
.blue-ink{color:var(--blue-ink)}.orange-ink{color:var(--orange-ink)}.violet-ink{color:var(--violet-ink)}.sky-ink{color:var(--sky-ink)}.coral-ink{color:var(--coral-ink)}.brand-ink{color:var(--brand-ink)}

/* AccentIcon */
.ai{width:var(--s,44px);height:var(--s,44px);border-radius:50%;display:grid;place-items:center;flex:none}
.ai.blue{background:var(--blue-soft);color:var(--blue-ink)}
.ai.orange{background:var(--orange-soft);color:var(--orange-ink)}
.ai.violet{background:var(--violet-soft);color:var(--violet-ink)}
.ai.sky{background:var(--sky-soft);color:var(--sky-ink)}
.ai.coral{background:var(--coral-soft);color:var(--coral-ink)}
.ai.brand{background:var(--brand-soft);color:var(--brand-ink)}
.ai.quiet{background:var(--sunken);color:var(--muted)}
.ai.f-orange{background:var(--orange);color:var(--on-accent)}

/* Buttons */
.btn{height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px;font-weight:600;padding:0 20px;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.sec{background:var(--sunken);color:var(--text)}
.btn.vio{background:var(--violet-soft);color:var(--violet-ink);height:40px;font-size:14px;padding:0 16px}
.card{background:var(--surface);border-radius:28px;box-shadow:var(--sh-2)}
.rb{--s:56px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh-key);color:var(--text);flex:none}
.t-dark .rb{background:var(--raised)}
.rb.power{background:var(--orange);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 30px -8px rgba(240,138,36,.65)}
.rb.ink{background:var(--text);color:var(--bg)}
.rb.sel{background:var(--sky-soft);color:var(--sky-ink);box-shadow:inset 0 0 0 1.5px var(--sky)}
.rb-l{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--muted)}
.rb-l.on{color:var(--text);font-weight:600}

/* Segmented */
.seg{display:flex;background:var(--sunken);border-radius:16px;padding:4px;gap:2px}
.seg span{flex:1;height:38px;display:grid;place-items:center;border-radius:12px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;padding:0 10px}
.seg span.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(21,24,27,.06),0 2px 8px -2px rgba(21,24,27,.10)}
.t-dark .seg span.on{background:var(--sunken-2);box-shadow:none}

/* Header with back */
.hdr{display:flex;align-items:center;gap:4px;height:64px;padding:0 12px 0 6px}
.hdr .back{width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
.hdr .tt{flex:1;min-width:0}
.hdr .tt b{display:block;font-size:18px;line-height:23px;font-weight:600;letter-spacing:-.01em}
.hdr .tt span{display:block;font-size:13px;line-height:17px;color:var(--muted)}

/* ============ TAB BAR + INTI ============ */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;padding-bottom:20px;background:var(--tabbar);box-shadow:0 -1px 0 var(--line);display:flex;z-index:40}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;line-height:14px;font-weight:500}
.tb .tbi{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.tb.on{color:var(--text);font-weight:600}
.tb.on .tbi{background:var(--sunken)}
.tb-mid{width:92px;flex:none;display:grid;place-items:center}
.dock-fade{position:absolute;left:0;right:0;bottom:0;height:270px;z-index:30;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 104px)}
.t-light .dock-fade{background:linear-gradient(to bottom,rgba(247,246,242,0),rgba(247,246,242,.85) 70px,var(--bg) 104px)}
.t-dark .dock-fade{background:linear-gradient(to bottom,rgba(14,16,18,0),rgba(14,16,18,.85) 70px,var(--bg) 104px)}
.dock{position:absolute;left:0;right:0;bottom:42px;z-index:45;display:flex;flex-direction:column;align-items:center;gap:20px;pointer-events:none}
.hint{font-size:12.5px;line-height:16px;font-weight:500;color:var(--muted);letter-spacing:.005em}

.inti{position:relative;width:var(--d);height:var(--d);flex:none}
.inti .glow{position:absolute;inset:calc(var(--d) * -.55);border-radius:50%;
  background:
   radial-gradient(closest-side circle at 40% 44%, rgba(25,179,166,.55), transparent),
   radial-gradient(closest-side circle at 62% 58%, rgba(59,111,224,.42), transparent),

.inti .ring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,rgba(29,117,80,0),#19B3A6,#3B6FE0,#B7E07A,rgba(29,117,80,0));

@keyframes breathe{0%,100%{opacity:.62;transform:scale(calc(var(--gs,1) * .9))}50%{opacity:1;transform:scale(calc(var(--gs,1) * 1.06))}}

.trow .bd span{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--muted);margin-top:3px}
.trow.past{opacity:.5}
.trow.past .rl i{background:var(--faint)}
.trow.next .bd{background:var(--blue-soft)}
.trow.next .rl i{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 5px var(--blue-soft)}
.trow.next .tm{color:var(--blue-ink)}
.nowline{position:relative;height:28px;display:flex;align-items:center;margin-left:52px}
.nowline:before{content:"";position:absolute;left:7px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.nowline:after{content:"";position:absolute;left:24px;right:0;height:2px;background:var(--blue);border-radius:1px}
.nowline span{position:absolute;left:-52px;font-size:12px;font-weight:700;color:var(--blue-ink)}
.bchrome{position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--tabbar);border-radius:28px 28px 0 0;box-shadow:0 -1px 0 var(--line),0 -16px 30px -18px rgba(21,24,27,.18)}
.t-dark .bchrome{box-shadow:0 -1px 0 var(--line)}
.bchrome .tabbar{position:relative;box-shadow:none;background:transparent}
.composer{margin:12px 16px 0;height:52px;border-radius:26px;background:var(--sunken);display:flex;align-items:center;gap:10px;padding:0 6px 0 18px}
.composer .ph{flex:1;font-size:14.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer .add{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.t-dark .composer .add{color:#0E1012}
.inti-sm{--d:46px}

/* ============ USAHA ============ */
.share{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:3px}
.share i{display:block;height:100%;border-radius:4px}
.brow{display:flex;align-items:center;gap:12px;padding:10px 0}
.brow .sw2{width:10px;height:10px;border-radius:3px;flex:none}
.brow .nm{flex:1;font-size:15px;font-weight:600}
.brow .am{font-size:15px;font-weight:600}
.brow .pc{width:52px;text-align:right;font-size:13px;font-weight:600}
.stock{display:flex;align-items:center;gap:14px;padding:10px 0}
.stock .meter{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}

/* ============ BOARD ============ */
.board{max-width:1900px;margin:0 auto;padding:56px 48px 80px}
.bh{display:block;margin-bottom:24px}
.bh .k{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:#1D7550}
.bh h1{font-size:46px;line-height:52px;letter-spacing:-.035em;font-weight:600;margin-top:14px}
.bh p{font-size:17px;line-height:27px;color:#4A4E54;margin-top:14px;max-width:62ch}
.found{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:36px}
.fcard{background:#FBFAF7;border-radius:24px;padding:18px}
.fcard h4{font-size:13px;font-weight:600;color:#6B6F76;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;gap:6px;width:60px;font-size:11px;line-height:13px;color:#4A4E54;font-weight:500}
.chip i{display:block;height:40px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.grad{height:56px;border-radius:16px;background:linear-gradient(90deg,#1D7550,#19B3A6 50%,#3B6FE0);position:relative}
.grad:after{content:"";position:absolute;right:28%;top:-4px;width:18px;height:18px;border-radius:50%;background:#B7E07A;box-shadow:0 0 0 3px #FBFAF7}
.sect{margin-top:64px}
.sect h2{font-size:28px;line-height:34px;letter-spacing:-.025em;font-weight:600}
.sect > p{font-size:16px;line-height:25px;color:#4A4E54;margin-top:8px;max-width:80ch}

/* ---------- small charts ---------- */
function smooth(pts){ // Catmull-Rom to cubic bezier
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2, k=.18;
    d += ` C${p1[0]+(p2[0]-p0[0])*k},${p1[1]+(p2[1]-p0[1])*k} ${p2[0]-(p3[0]-p1[0])*k},${p2[1]-(p3[1]-p1[1])*k} ${p2[0]},${p2[1]}`;
  }
  return d;
}
const SALES = [3.10,3.60,2.90,3.80,4.40,4.90,4.25];
function spark(w,h,vals,{pad=6,id='sp',stroke='var(--violet)',dot=true,area=true,top=6}={}){
  const mn=Math.min(...vals)*.92, mx=Math.max(...vals)*1.02;
  const pts = vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1), top+(h-top-4)*(1-(v-mn)/(mx-mn))]);
  const d = smooth(pts); const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--violet)" stop-opacity=".26"/><stop offset="1" stop-color="var(--violet)" stop-opacity="0"/></linearGradient></defs>
   ${area?`<path d="${d} L${last[0]},${h} L${pts[0][0]},${h} Z" fill="url(#${id})"/>`:''}
   <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round"/>
   ${dot?`<circle cx="${last[0]}" cy="${last[1]}" r="8" fill="var(--violet)" opacity=".18"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--violet)" stroke="var(--bg)" stroke-width="2"/>`:''}
  </svg>`;
}

/* ---------- AC remote ---------- */
function acDial(){
  const cx=196.5, cy=160, r=128, a0=135, a1=405, v=24, mn=16, mx=30;
  const ang = a0 + (v-mn)/(mx-mn)*(a1-a0);
  const pt=(a,rr=r)=>[cx+rr*Math.cos(a*Math.PI/180), cy+rr*Math.sin(a*Math.PI/180)];
  const arc=(s,e,rr=r)=>{const p=pt(s,rr),q=pt(e,rr);return `M${p[0]},${p[1]} A${rr},${rr} 0 ${e-s>180?1:0} 1 ${q[0]},${q[1]}`};
  let ticks='';
  for(let t=mn;t<=mx;t++){const a=a0+(t-mn)/(mx-mn)*(a1-a0);const p=pt(a,r+17),q=pt(a,r+(t===v?28:22));
    ticks+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${t===v?'var(--sky)':'var(--faint)'}" stroke-width="${t===v?2.5:1.5}" stroke-linecap="round" opacity="${t===v?1:.6}"/>`;}
  const k=pt(ang); const l16=pt(a0,r+44), l30=pt(a1,r+44);
  return `<svg width="393" height="320" viewBox="0 0 393 320" style="position:absolute;inset:0;overflow:visible">
    <defs>
      <linearGradient id="acg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#A7E1F4"/><stop offset="1" stop-color="var(--sky)"/></linearGradient>
      <radialGradient id="acglow"><stop offset="0" stop-color="var(--sky)" stop-opacity=".16"/><stop offset="1" stop-color="var(--sky)" stop-opacity="0"/></radialGradient>
      <filter id="ksh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#15181B" flood-opacity=".22"/></filter>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${r-8}" fill="url(#acglow)"/>
    ${ticks}
    <path d="${arc(a0,a1)}" fill="none" stroke="var(--sunken-2)" stroke-width="16" stroke-linecap="round"/>
    <path d="${arc(a0,ang)}" fill="none" stroke="url(#acg)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="${k[0]}" cy="${k[1]}" r="15" fill="#FFFFFF" filter="url(#ksh)"/><circle cx="${k[0]}" cy="${k[1]}" r="5" fill="var(--sky)"/>
    <text x="${l16[0]+8}" y="${l16[1]+4}" font-size="12" font-weight="600" fill="var(--muted)" font-family="Plus Jakarta Sans">16°</text>
    <text x="${l30[0]-26}" y="${l30[1]+4}" font-size="12" font-weight="600" fill="var(--muted)" font-family="Plus Jakarta Sans">30°</text>
  </svg>`;
}

    <div class="dial-wrap" style="margin-top:10px">${acDial()}
      <div class="dial-c"><div class="dial-mode">${I('snow',16,2)}Mendinginkan</div><div class="readout num">24<sup>°</sup></div><div class="dial-sub">Kamar sekarang 27°</div></div>

/* ===================================================================== */
/* WAVES: 4 layered gradient waves, blurred, additive. Same algorithm as spec.md */
/* ===================================================================== */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LAYERS = [
  // glow colours = brand gradient lifted for a dark canvas (green 2FBF7F, teal 19D3C0, blue 4F86FF, lime C6F08A)
  {base:.34, amp:.20, f:.85, sp:.55, ph:0.0, c:['#2FBF7F','#19D3C0','#4F86FF'], a:.85, blur:34, band:.55},
  {base:.40, amp:.17, f:1.3, sp:-.7, ph:1.7, c:['#4F86FF','#19D3C0','#2FBF7F'], a:.75, blur:24, band:.45},
  {base:.46, amp:.14, f:1.75,sp:.95, ph:3.1, c:['#2FBF7F','#4F86FF','#7C9CFF'], a:.62, blur:14, band:.35},
  {base:.52, amp:.10, f:2.3, sp:-1.25,ph:4.4,c:['#C6F08A','#5FE3B5','#4F86FF'], a:.55, blur:8,  band:.28},
];
function startWaves(cv){
  const mode = cv.dataset.mode;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const W = cv.clientWidth || 393, H = cv.clientHeight || 540;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const off = document.createElement('canvas'); off.width=W*dpr; off.height=H*dpr;
  const o = off.getContext('2d'); o.setTransform(dpr,0,0,dpr,0,0);
  const orbEl = cv.parentElement.querySelector('.hold .inti');
  let level = mode==='think' ? .14 : .55, target = level, nextAt = 0;
  const N = 56;
  function y(l,u,t,lv){
    const env = .38 + .62*Math.pow(Math.sin(Math.PI*u), 1.3);
    const w = .62*Math.sin(2*Math.PI*l.f*u + l.sp*t*1.6 + l.ph) + .38*Math.sin(2*Math.PI*l.f*1.9*u - l.sp*t*2.1 + l.ph*2);
    return H*l.base - H*l.amp*lv*env*w - H*.10*lv*env;
  }
  function draw(t){
    const speed = mode==='think' ? .45 : 1;
    const tt = t*speed;
    if (mode==='listen'){ // speech-like envelope: new target every 90-170 ms, attack fast, release slow
      if (t>nextAt){ target = Math.random()<.18 ? .12 : .35 + Math.random()*.65; nextAt = t + .09 + Math.random()*.08; }
      level += (target-level) * (target>level ? .35 : .10);
    } else { level += (.14 + .04*Math.sin(t*1.3) - level)*.1; }
    ctx.clearRect(0,0,W,H);
    // deep base glow at the very bottom
    const bg = ctx.createLinearGradient(0,H*.55,0,H); bg.addColorStop(0,'rgba(10,40,40,0)'); bg.addColorStop(1,'rgba(20,70,80,.30)');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    LAYERS.forEach((l,li)=>{
      o.globalCompositeOperation='source-over'; o.clearRect(0,0,W,H);
      o.beginPath(); o.moveTo(0,H);
      for(let i=0;i<=N;i++){const u=i/N; o.lineTo(u*W, y(l,u,tt,level));}
      o.lineTo(W,H); o.closePath();
      const g=o.createLinearGradient(0,0,W,0); g.addColorStop(0,l.c[0]); g.addColorStop(.5,l.c[1]); g.addColorStop(1,l.c[2]);
      o.fillStyle=g; o.fill();
      o.globalCompositeOperation='destination-in';
      // each layer is a luminous band: opaque at the crest, gone ~band*H below it
      const top=H*(l.base-l.amp*level-.06), bot=Math.min(H, top + H*l.band);
      const v=o.createLinearGradient(0,top,0,bot); v.addColorStop(0,'rgba(0,0,0,1)'); v.addColorStop(.25,'rgba(0,0,0,.55)'); v.addColorStop(1,'rgba(0,0,0,0)');
      o.fillStyle=v; o.fillRect(0,0,W,H);
      ctx.filter=`blur(${l.blur}px)`; ctx.globalAlpha=l.a*(mode==='think'?.7:1); ctx.drawImage(off,0,0,W,H);
      if (li===3){ // soft luminous crest on the front layer only
        ctx.filter='blur(3px)'; ctx.globalAlpha=.32;
        ctx.beginPath(); for(let i=0;i<=N;i++){const u=i/N; const yy=y(l,u,tt,level); i?ctx.lineTo(u*W,yy):ctx.moveTo(0,yy);}
        const sg=ctx.createLinearGradient(0,0,W,0); sg.addColorStop(0,'rgba(183,224,122,0)'); sg.addColorStop(.35,'rgba(214,245,190,1)'); sg.addColorStop(.7,'rgba(170,220,255,1)'); sg.addColorStop(1,'rgba(183,224,122,0)');
        ctx.strokeStyle=sg; ctx.lineWidth=3; ctx.stroke();
      }
    });
    if (mode==='think'){ // calm shimmer sweeping across
      const sx = ((t*.22)%1.4 - .2)*W;
      const rg = ctx.createRadialGradient(sx,H*.58,0,sx,H*.58,150);
      rg.addColorStop(0,'rgba(220,245,210,.45)'); rg.addColorStop(1,'rgba(220,245,210,0)');
      ctx.filter='blur(10px)'; ctx.globalAlpha=1; ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    }
    ctx.filter='none'; ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    if (orbEl) orbEl.style.setProperty('--gs', (1 + level*.45).toFixed(3));
  }
  if (reduce){ draw(1.2); return; }
  const t0 = performance.now() - 2200;
  (function loop(now){ draw((now-t0)/1000); requestAnimationFrame(loop); })(performance.now());
}
document.querySelectorAll('canvas.waves').forEach(startWaves);
